[[inputs.http_response]]
  urls = [
    "https://dasallrad.org",
    "https://freie-lasten.org",
    "https://freie-lastenradl.de",
    "https://flotte-berlin.de",
    "https://www.kasimir-lastenrad.de"
  ]
  response_timeout = "5s"
  interval = "1m"
  method = "GET"
  follow_redirects = true
  # Optional: confirm WordPress is actually rendering, not a generic 200 from a reverse proxy
  # response_string_match = "wordpress"
  # Tags for filtering in your dashboard
  [inputs.http_response.tags]
    check_type = "wordpress_uptime"
