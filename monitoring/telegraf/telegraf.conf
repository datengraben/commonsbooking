[agent]
  interval = "5m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = ""
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "commonsbooking"
  bucket = "gbfs"

# ===========================================================================
# HOW TO ADD MORE INSTANCES
#
# Duplicate the three blocks below (station_status, station_info,
# system_info) for each additional WordPress / CommonsBooking site.
# Set a unique `instance` tag so metrics from different sites don't collide.
# Add the corresponding URL variable to your .env file.
# ===========================================================================

# ---------------------------------------------------------------------------
# INSTANCE: instance_1
# ---------------------------------------------------------------------------

[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL_1}/wp-json/commonsbooking/v1/station_status.json"]
  method = "GET"
  timeout = "30s"
  interval = "5m"
  name_override = "gbfs_station_status"
  data_format = "json_v2"
  [inputs.http.tags]
    instance = "instance_1"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data.stations"
      tags = ["station_id"]
      included_keys = ["station_id", "num_vehicles_available", "is_installed", "is_renting", "is_returning"]
      fields = {num_vehicles_available = "int", is_installed = "bool", is_renting = "bool", is_returning = "bool"}

[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL_1}/wp-json/commonsbooking/v1/station_information.json"]
  method = "GET"
  timeout = "30s"
  interval = "1h"
  name_override = "gbfs_station_info"
  data_format = "json_v2"
  [inputs.http.tags]
    instance = "instance_1"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data.stations"
      tags = ["station_id", "address"]
      included_keys = ["station_id", "address", "lat", "lon"]
      fields = {lat = "float", lon = "float"}

[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL_1}/wp-json/commonsbooking/v1/system_information.json"]
  method = "GET"
  timeout = "30s"
  interval = "24h"
  name_override = "gbfs_system_info"
  data_format = "json_v2"
  [inputs.http.tags]
    instance = "instance_1"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["system_id", "timezone"]
      included_keys = ["system_id", "timezone", "opening_hours", "feed_contact_email"]

