[agent]
  interval = "5m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = ""
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "commonsbooking"
  bucket = "gbfs"

# ---------------------------------------------------------------------------
# station_status — real-time vehicle availability per station (every 5 min)
# Response shape: { data: { stations: [ { station_id, num_vehicles_available,
#                  is_installed, is_renting, is_returning, last_reported } ] } }
# ---------------------------------------------------------------------------
[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL}/wp-json/commonsbooking/v1/station_status.json"]
  method = "GET"
  timeout = "30s"
  interval = "5m"
  name_override = "gbfs_station_status"
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data.stations"
      tags = ["station_id"]
      included_keys = [
        "station_id",
        "num_vehicles_available",
        "is_installed",
        "is_renting",
        "is_returning",
      ]
      fields = {num_vehicles_available = "int", is_installed = "bool", is_renting = "bool", is_returning = "bool"}

# ---------------------------------------------------------------------------
# station_information — static station metadata: name, coordinates, address
# Scraped every hour because this data rarely changes.
# ---------------------------------------------------------------------------
[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL}/wp-json/commonsbooking/v1/station_information.json"]
  method = "GET"
  timeout = "30s"
  interval = "1h"
  name_override = "gbfs_station_info"
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data.stations"
      tags = ["station_id", "address"]
      included_keys = [
        "station_id",
        "address",
        "lat",
        "lon",
      ]
      fields = {lat = "float", lon = "float"}

# ---------------------------------------------------------------------------
# system_information — system-level metadata (scraped once per day)
# ---------------------------------------------------------------------------
[[inputs.http]]
  urls = ["${COMMONSBOOKING_URL}/wp-json/commonsbooking/v1/system_information.json"]
  method = "GET"
  timeout = "30s"
  interval = "24h"
  name_override = "gbfs_system_info"
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.object]]
      path = "data"
      tags = ["system_id", "timezone"]
      included_keys = [
        "system_id",
        "timezone",
        "opening_hours",
        "feed_contact_email",
      ]
