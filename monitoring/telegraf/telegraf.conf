[agent]
  interval = "5m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = ""
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "commonsbooking"
  bucket = "gbfs"

# ===========================================================================
# HOW TO ADD MORE INSTANCES
#
# Duplicate the three blocks below (station_status, station_info,
# system_info) for each additional WordPress / CommonsBooking site.
# Set a unique `instance` tag so metrics from different sites don't collide.
# Add the corresponding URL variable to your .env file.
# ===========================================================================

[[inputs.http]]

urls = ["https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bn/de/station_status.json"]

interval = "1m"

name_override = 'gbfs_station_status'

tagexclude = ['url', 'host']

data_format = "json_v2"

    [inputs.http.tags]
      instance = "nextbike_berlin"

    [[inputs.http.json_v2]]

        [[inputs.http.json_v2.tag]]
          path = "version"
          rename = "gbfs_version"

        [[inputs.http.json_v2.object]]

            path = "data.stations"

            # Set station metadata as tags
            tags = ["station_id"]

            included_keys = ["station_id", "num_bikes_available", "is_installed", "is_renting", "is_returning"]
            fields = {num_bikes_available = "int", is_installed = "bool", is_renting = "bool", is_returning = "bool"}


