name: 'Build Plugin'
description: 'Builds plugin into ./build/commonsbooking'

inputs:
  generate_zip:
    description: 'Set to true, if a zip file should be generated in the root of the plugin folder'
    required: false
    default: 'false'
    options:
      - true
      - false

runs:
  using: "composite"
  steps:

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        # Cache the Strauss-generated vendor-prefixed tree alongside vendor.
        # A dedicated "-nodev" key namespace keeps this --no-dev install from
        # colliding with the dev-dependency caches used by the test workflows.
        path: |
          vendor
          vendor-prefixed
        key: ${{ runner.os }}-php-nodev-${{ hashFiles('composer.lock', 'composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-nodev-

    - name: Install dependencies
      run: |
        composer install --no-dev --prefer-dist --no-progress ${{ steps.composer-cache.outputs.cache-hit == 'true' && '--no-scripts' || '' }}
      shell: bash

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci --legacy-peer-deps --include=dev
      shell: bash

    - name: Run build script (skip zip generation)
      if: ${{ inputs.generate_zip == 'false' }}
      run: bin/build-zip.sh --skip-zip
      shell: bash

    - name: Run build script and generate zip file
      if: ${{ inputs.generate_zip == 'true' }}
      run: bin/build-zip.sh
      shell: bash
