name: PHP Code Beautifier Check

on:
  push:
    paths:
      - '**/*.php'
  pull_request:
    paths:
      - '**/*.php'
  workflow_dispatch:


jobs:
  phpcbf-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'  # Adjust this to your PHP version
          extensions: uopz


      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          # Cache vendor-prefixed so Strauss (run on composer install) is skipped
          # when composer.lock and the Strauss config in composer.json are unchanged.
          path: |
            vendor
            vendor-prefixed
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs ${{ steps.composer-cache.outputs.cache-hit == 'true' && '--no-scripts' || '' }}

      - name: Run phpcbf
        run: ./vendor/bin/phpcbf -q --parallel=1 src templates includes tests commonsbooking.php

      - name: Verify code style is unchanged
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: phpcbf made changes. Please run phpcbf locally and commit the fixes."
            exit 1
          else
            echo "Code style is compliant."
          fi
